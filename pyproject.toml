[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "glixin-tools"
version = "0.2.0"
description = "Lightweight Python client for Glixin Sovereign PE, SPD, and SWD APIs"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.25.0"
]

[project.urls]
Homepage = "https://glixin.com/"
Repository = "https://github.com/Pete-glixin/glixin-tools"
Documentation = "https://glixin.com/"